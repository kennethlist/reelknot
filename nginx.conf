server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # HTML entry points must always be revalidated so new deploys are picked
    # up; the hashed assets they reference can be cached forever.
    location ~ ^/(index|maps)\.html$ {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Same-origin proxy for USGS US Topo tiles, used by Print Maps when the
    # browser cannot fetch them cross-origin. The upstream is resolved lazily
    # (so nginx still starts offline) with the container's own nameservers:
    # the nginx image's entrypoint exports them as NGINX_LOCAL_RESOLVERS and
    # renders this file from /etc/nginx/templates (see Dockerfile).
    location ~ ^/tiles/(\d+)/(\d+)/(\d+)$ {
        resolver ${NGINX_LOCAL_RESOLVERS} valid=300s ipv6=off;
        set $usgs "https://basemap.nationalmap.gov";
        proxy_pass $usgs/arcgis/rest/services/USGSTopo/MapServer/tile/$1/$2/$3;
        proxy_ssl_server_name on;
        proxy_set_header Host basemap.nationalmap.gov;
        proxy_hide_header Set-Cookie;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
